<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Distorsión · Agenda de shows de metal en Argentina</title>
<meta name="description" content="La agenda de shows de metal en Argentina. Fechas verificadas, line-ups, entradas, flyers, bandas y lugares, con cada cambio a la vista.">
<meta property="og:title" content="Distorsión · Agenda de shows de metal en Argentina">
<meta property="og:description" content="Fechas verificadas, line-ups, entradas y flyers de los shows de metal en todo el país.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Saira+Extra+Condensed:wght@700;900&family=Martian+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<style id="app-style">
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one black stage. A giant condensed wordmark, then the bill of shows ruled like a tour poster's date list; flyers stay grayscale until touched. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#000;--ink:#ececec;--mute:#8e8e8e;--dim:#5c5c5c;--line:#262626;--line-2:#3a3a3a;--panel:#0a0a0a;--panel-2:#151515;
  --warn:#e7b549;--bad:#ff4538;
  --f-mark:'Unbounded','Arial Black','Helvetica Neue',sans-serif;
  --f-disp:'Saira Extra Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Martian Mono',ui-monospace,Menlo,Consolas,monospace;
  --grain:none;
}
*{box-sizing:border-box}
html{background:#000}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-synthesis:none}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:300;background-image:var(--grain);opacity:.07;mix-blend-mode:screen}
body.lock{overflow:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,44px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp);font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:.005em}
.grow{flex:1 1 auto}
.help{font-size:13.5px;color:var(--mute);margin:0}
.lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}

/* header */
.top{padding-top:22px;border-bottom:1px solid var(--line)}
.top-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;padding-bottom:12px}
.mark{display:inline-block;max-width:100%;white-space:nowrap;font-family:var(--f-mark);font-weight:900;text-transform:uppercase;font-size:clamp(48px,11vw,150px);line-height:.98;padding-top:.06em;letter-spacing:-.03em;margin:0;text-decoration:none;background:repeating-linear-gradient(180deg,var(--ink) 0 3px,#8f8f8f 3px 4px);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin:14px 0 0;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:var(--mute);max-width:60ch}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;border-top:1px solid var(--line);margin-top:20px;padding-block:12px}
.nav a{font-family:var(--f-disp);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.07em;font-size:15px;text-decoration:none;color:var(--ink)}
.nav a:hover,.nav a[aria-current=page]{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.nav .sep{color:var(--dim);font-family:var(--f-mono);font-size:13px}
.nav a.cta{margin-left:auto;background:var(--ink);color:#000;padding:5px 11px}
.nav a.cta:hover{background:#fff;text-decoration:none}

/* editor bars */
.adminbar,.visitorbar{background:var(--panel-2);border-bottom:1px solid var(--line-2);font-size:14px}
.ab-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px}
.ab-pub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.ab-dirty{font-family:var(--f-mono);font-size:12.5px;color:var(--warn)}
.visitorbar .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding-block:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--f-disp);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.07em;font-size:15px;line-height:1.1;text-decoration:none;cursor:pointer;border-radius:0;transition:background .12s,color .12s}
.btn:hover{background:var(--ink);color:#000}
.btn.solid{background:var(--ink);color:#000}
.btn.solid:hover{background:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.quiet{border-color:var(--line-2);color:var(--mute)}
.btn.quiet:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#000}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line-2);background:transparent;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;font-size:15px;line-height:1;flex:none;border-radius:0}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}

/* hero */
.hero{border-bottom:1px solid var(--line);padding-block:clamp(28px,5vw,60px)}
.hero-in{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:clamp(24px,4vw,56px);align-items:end}
.kicker{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 16px}
.kicker b{background:var(--ink);color:#000;padding:2px 7px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.hero-title{font-size:clamp(58px,10.5vw,144px);margin:0;overflow-wrap:anywhere;text-wrap:balance}
.hero-title a{text-decoration:none}
.hero-sub{font-family:var(--f-disp);font-weight:700;font-stretch:75%;text-transform:uppercase;font-size:clamp(20px,2.6vw,30px);line-height:1.05;color:var(--mute);margin:14px 0 0;text-wrap:balance}
.hero-meta{font-family:var(--f-mono);font-size:14px;line-height:1.7;margin:22px 0 0;text-transform:uppercase;letter-spacing:.03em}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.flyer{display:block;border:1px solid var(--line-2);background:var(--panel);max-width:100%;text-decoration:none}
.flyer img{display:block;width:100%;height:auto;filter:grayscale(1) contrast(1.15);transition:filter .35s}
.flyer:hover img,.flyer:focus-visible img{filter:none}
.poster{aspect-ratio:4/5;max-width:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;background:repeating-linear-gradient(0deg,#0a0a0a 0 6px,#121212 6px 7px);font-family:var(--f-disp);font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:clamp(36px,5vw,58px);line-height:.85;overflow-wrap:anywhere;color:var(--ink)}
.poster small{font-family:var(--f-mono);font-size:11.5px;font-weight:400;font-stretch:100%;color:var(--mute);letter-spacing:.1em;margin-top:12px;line-height:1.4}
@media (max-width:760px){.hero-in{grid-template-columns:1fr}.hero-in .flyer{max-width:300px}}

/* filters */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.f-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px}
.f-search{flex:1 1 240px;min-width:0}
input[type=search],input[type=text],input[type=url],input[type=date],input[type=time],input[type=email],input[type=tel],select,textarea{background:var(--panel);border:1px solid var(--line-2);border-radius:0;padding:10px 12px;width:100%;min-width:0;font-size:15px;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
::placeholder{color:var(--dim)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.f-prov{width:auto;flex:0 1 210px}
.seg{display:inline-flex;border:1px solid var(--line-2);flex:none}
.seg button{background:transparent;border:0;padding:9px 12px;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#000}
.f-past{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.f-past input,.check input{accent-color:#ececec;width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.chip{border:1px solid var(--line-2);background:transparent;padding:4px 10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--mute)}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#000;border-color:var(--ink)}
@media (max-width:640px){.filters .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.f-prov{flex:1 1 140px}}

/* the bill */
.agenda{padding-block:22px 72px}
.count{margin:0}
.month{margin-top:36px}
.month h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin:0 0 4px;font-size:clamp(40px,6vw,64px);border-bottom:1px solid var(--ink);padding-bottom:6px}
.bill{display:grid}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:0 22px;align-items:center;padding:18px 10px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative}
.row:hover,.row:focus-visible{background:#ececec;color:#000;--ink:#000;--mute:#3c3c3c;--dim:#555;--line:#000;--line-2:#000;outline:none}
.r-date{display:flex;align-items:center;gap:10px}
.r-dd{font-size:72px;line-height:.8}
.r-mo{display:flex;flex-direction:column;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;line-height:1.35}
.r-mo span:first-child{color:var(--mute)}
.r-body{min-width:0}
.r-ev{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.r-head{font-size:clamp(30px,4.2vw,50px);overflow-wrap:anywhere}
.row.cancel .r-head{text-decoration:line-through;text-decoration-thickness:4px;color:var(--mute)}
.r-sup{font-weight:600;color:var(--mute);font-size:15.5px;margin-top:6px}
.r-meta{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:10px}
.r-tags{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.r-side{display:flex;align-items:center;gap:16px}
.r-thumb{width:78px;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.15);border:1px solid var(--line-2);display:block;max-width:100%}
.row:hover .r-thumb{filter:none}
@media (max-width:680px){
  .row{grid-template-columns:76px minmax(0,1fr);gap:0 14px;padding:16px 4px}
  .r-date{flex-direction:column;align-items:flex-start;gap:6px}
  .r-dd{font-size:54px}
  .r-mo{flex-direction:row;gap:6px}
  .r-side{grid-column:1/-1;margin-top:12px;justify-content:space-between}
  .r-thumb{display:none}
}
.st{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:1px solid currentColor;white-space:nowrap;line-height:1.2}
.st-ok{background:var(--ink);color:#000;border-color:var(--ink)}
.row:hover .st-ok{color:#ececec}
.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}.st-neutral{color:var(--mute)}
.row:hover .st-warn{color:#6e4f00}.row:hover .st-bad{color:#a8160b}
.ver{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ver.v-on{color:var(--ink)}
.badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border:1px dashed var(--line-2);color:var(--mute)}
.badge.draft{color:var(--warn);border-color:var(--warn)}
.badge.feat{color:var(--ink);border-color:var(--ink);border-style:solid}
.empty{border:1px dashed var(--line-2);padding:44px 20px;text-align:center;color:var(--mute);display:grid;gap:14px;justify-items:center;margin-top:18px}
.empty h3{font-size:clamp(40px,6vw,64px);color:var(--ink);margin:0}
.empty p{margin:0;max-width:52ch}

/* footer */
.foot{border-top:1px solid var(--line);padding-block:36px 52px;color:var(--mute);font-size:15px}
.foot-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
.foot p{margin:8px 0 0;max-width:60ch}
.foot-mark{font-size:56px;color:var(--ink)}
.sel{user-select:all;color:var(--ink)}
@media (max-width:680px){.foot-in{grid-template-columns:1fr}}

/* overlay pages */
.page{position:fixed;inset:0;z-index:50;background:#000;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.p-top{position:sticky;top:0;z-index:3;background:#000;border-bottom:1px solid var(--line)}
.p-top .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;padding-block:10px}
.p-mark{font-family:var(--f-disp);font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:34px;line-height:1;text-decoration:none;letter-spacing:-.01em}
.p-top .nav{border:0;margin:0;padding:0;flex:1 1 auto}
.p-body{padding-block:30px 72px}
.p-title{font-size:clamp(56px,10vw,140px);margin:0;overflow-wrap:anywhere;text-wrap:balance}
.p-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,56px);align-items:start}
@media (max-width:820px){.p-grid{grid-template-columns:1fr}.p-grid>figure{max-width:440px}}
figure{margin:0}
.d-flyer button{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%}
.d-flyer img{width:100%;height:auto;display:block;border:1px solid var(--line-2)}
.d-lineup{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:6px}
.d-lineup li{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.d-band{font-size:34px;text-decoration:none}
.d-lineup li.head .d-band{font-size:44px}
.d-band:hover{text-decoration:underline;text-decoration-thickness:3px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 22px;margin:26px 0;padding:18px 0;border-block:1px solid var(--line)}
.facts dt{padding-top:3px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts a{text-underline-offset:3px}
.d-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sec{padding-block:26px;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(34px,5vw,52px);margin:0 0 16px}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.prose a{overflow-wrap:anywhere;text-underline-offset:3px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.gal button{padding:0;border:0;background:none;cursor:zoom-in;display:block}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;display:block;filter:grayscale(1) contrast(1.1);transition:filter .3s}
.gal button:hover img{filter:none}
.banner{padding:12px 14px;border:1px solid currentColor;margin:0 0 18px;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.verify{border:1px solid var(--line-2);padding:16px;display:grid;gap:10px;margin-top:22px}
.verify .v-title{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.v-sq{width:12px;height:12px;border:1.5px solid var(--ink);flex:none}
.v-sq.on{background:var(--ink)}
.verify ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.changes{list-style:none;padding:0;margin:0;display:grid;gap:0;border-top:1px solid var(--line)}
.changes li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.setlists{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.setlists h3{font-size:30px;margin:0 0 10px}
.setlists ol{margin:0;padding-left:28px;font-family:var(--f-mono);font-size:13.5px;line-height:1.8}
.ix-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 8px}
.ix{border-top:1px solid var(--line);margin-top:10px}
.ix-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:baseline;padding:14px 8px;border-bottom:1px solid var(--line);text-decoration:none}
.ix-row:hover{background:#ececec;color:#000;--mute:#3c3c3c}
.ix-name{font-size:clamp(28px,4vw,42px);overflow-wrap:anywhere}
.ix-meta{text-align:right}
.lead{font-size:18px;max-width:62ch;margin:14px 0 0;color:var(--ink)}
.sub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sub-grid .full{grid-column:1/-1}
@media (max-width:640px){.sub-grid{grid-template-columns:1fr}}
.msg{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;line-height:1.6;background:var(--panel);border:1px solid var(--line-2);padding:14px 16px;margin:0;overflow-wrap:anywhere}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:22px}
.channel{border:1px solid var(--line-2);padding:18px;display:grid;gap:10px;align-content:start}
.channel h3{font-size:34px;margin:0}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;padding:56px 16px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lb-btn{position:absolute;background:#000;border:1px solid var(--ink);color:var(--ink);width:44px;height:44px;font-size:22px;cursor:pointer;display:grid;place-items:center;border-radius:0}
.lb-btn:hover{background:var(--ink);color:#000}
.lb-x{top:calc(10px + env(safe-area-inset-top,0px));right:12px}
.lb-prev{left:12px;top:50%;transform:translateY(-50%)}
.lb-next{right:12px;top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--mute);font-size:13px}

/* editor drawer */
.drawer{position:fixed;inset:0;z-index:60}
.dr-scrim{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.dr-panel{position:absolute;top:0;right:0;bottom:0;width:min(680px,100%);background:#050505;border-left:1px solid var(--ink);overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dr-head{position:sticky;top:0;z-index:3;background:#050505;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line-2)}
.dr-head h2{font-size:40px;margin:0}
.dr-body{padding:18px 20px 28px;display:grid;gap:18px}
.dr-foot{position:sticky;bottom:0;z-index:3;background:#050505;border-top:1px solid var(--line-2);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:auto}
fieldset{border:1px solid var(--line-2);padding:14px 16px 16px;margin:0;display:grid;gap:12px;min-width:0}
legend{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink);padding:0 6px}
.fld{display:grid;gap:6px;min-width:0}
.fld>span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fld em{font-style:normal;text-transform:none;letter-spacing:0}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rep{display:grid;gap:8px}
.rep-row{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr) auto;gap:6px;align-items:center}
.rep-row.band{grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,.9fr) auto}
.rep-row.change{grid-template-columns:100px minmax(0,1fr) auto}
.row-tools{display:flex;gap:4px}
.check{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
@media (max-width:560px){
  .row2,.row3{grid-template-columns:1fr}
  .rep-row,.rep-row.band{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rep-row>:first-child{grid-column:1/-1}
  .rep-row .row-tools{grid-column:1/-1;justify-content:flex-end}
  .rep-row.change{grid-template-columns:minmax(0,1fr) auto}
}
.drop{border:2px dashed var(--line-2);padding:18px;text-align:center;cursor:pointer;color:var(--mute);display:grid;place-items:center;min-height:150px;background:var(--panel)}
.drop:hover,.drop.over{border-color:var(--ink);color:var(--ink)}
.drop img{max-height:340px;width:auto;max-width:100%;display:block}
.drop p{margin:0}
.drop strong{color:var(--ink)}
.gal-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.gal-edit figure{display:grid;gap:5px}
.gal-edit img{aspect-ratio:1;object-fit:cover;width:100%;display:block}
.gal-edit .row-tools{justify-content:space-between}
.gal-edit .icon-btn{width:32px;height:32px}
.form-err{color:var(--bad);border:1px solid currentColor;padding:10px 12px;font-family:var(--f-mono);font-size:13px}
.form-err p{margin:0}
.mlist{display:grid;gap:8px}
.mlist h3{margin:10px 0 2px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);background:var(--panel)}
.mrow-main{min-width:0}
.mrow-t{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.mrow-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.mrow .row-tools{flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.mrow{grid-template-columns:minmax(0,1fr)}.mrow .row-tools{justify-content:flex-start}}
.meter{height:9px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-2)}
.meter i{display:block;height:100%;background:var(--ink)}
.meter.hot i{background:var(--warn)}

/* toast + busy */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;background:var(--ink);color:#000;padding:12px 16px;font-family:var(--f-mono);font-size:13px;letter-spacing:.02em;width:max-content;max-width:min(92vw,520px)}
.toast.bad{background:var(--bad);color:#000}
.busy{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.88);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-stretch:62%;font-size:72px;text-transform:uppercase;text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* wide display: wordmark, section and month titles */
.foot-mark,.p-mark,.month h3,.sec h2,.empty h3,.channel h3,.dr-head h2,.busy{font-family:var(--f-mark);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-stretch:normal;line-height:1}
.month h3{font-size:clamp(30px,4.6vw,54px)}
.sec h2{font-size:clamp(24px,3.4vw,38px)}
.empty h3{font-size:clamp(26px,4vw,40px)}
.channel h3{font-size:24px}
.dr-head h2{font-size:24px}
.foot-mark{font-size:clamp(28px,4vw,40px)}
.p-mark{font-size:22px}
.busy{font-size:clamp(36px,7vw,64px)}
.lbl,.ver,.st,.badge,.seg button,.chip,.f-past,.kicker b,.r-mo,.r-meta,.r-ev,legend,.fld>span,.toast{letter-spacing:.03em}
.lbl,.ver,.st,.badge,.chip,.seg button{font-size:10.5px}

/* the nexus: every band wired to one point */
.nexus{border-bottom:1px solid var(--line);overflow:hidden}
.nexus-in{position:relative;padding-block:8px 28px;display:grid;justify-items:center}
#nexus-c{width:100%;max-width:860px;height:min(62vh,540px,calc(100vw - 8px));min-height:300px;display:block;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none}
#nexus-c.dragging{cursor:grabbing}
#nexus-c.on-node{cursor:pointer}
.nexus-cap{display:grid;justify-items:center;gap:8px;text-align:center;margin-top:-4px}
.nexus-n{font-size:clamp(26px,3.6vw,40px)}
.nexus-tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:#000;padding:8px;transform:translate(-50%,calc(-100% - 16px));z-index:2;display:flex;gap:10px;align-items:flex-start;width:max-content;max-width:min(340px,calc(100% - 16px))}
.nexus-tip.below{transform:translate(-50%,18px)}
.nexus-tip img{width:58px;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.15);flex:none;display:block}
.tt-body{display:grid;gap:3px;min-width:0;padding:2px 4px 2px 2px}
.nexus-tip b{display:block;font-family:var(--f-disp);font-weight:900;text-transform:uppercase;font-size:24px;line-height:.92;overflow-wrap:anywhere}
.nexus-tip em{font-style:normal;font-family:var(--f-disp);font-weight:700;text-transform:uppercase;font-size:15px;line-height:1;color:#333}
.nexus-tip span{font-family:var(--f-mono);font-size:10px;letter-spacing:.02em;line-height:1.4}
.nexus-tip .tt-date{font-weight:500}
.nexus-tip .tt-st{justify-self:start;border:1px solid #000;padding:1px 5px;margin-top:2px}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="color:#ececec;padding:24px;font-family:sans-serif">Distorsión necesita JavaScript para mostrar la agenda.</p></noscript>
<script id="app-js">
(function(){
'use strict';
var RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
var SKEL_OPEN='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>';
var FONT_LINK='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Saira+Extra+Condensed:wght@700;900&family=Martian+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;700&display=swap">';
var MAX_BYTES=16*1024*1024;

var PROVS=['CABA','Buenos Aires','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucumán'];
var GENRES=['Heavy','Thrash','Death','Black','Doom','Power','Speed','Prog','Groove','Stoner','Sludge','Grindcore','Hardcore','Metalcore','Deathcore','Nu Metal','Folk','Gothic','Sinfónico','Industrial','Hard Rock','Post-metal'];
var STATUS={anunciado:'Anunciado',venta:'Entradas a la venta',ultimas:'Últimas entradas',agotado:'Agotado',gratis:'Gratis',puerta:'Entrada en puerta',reprogramado:'Reprogramado',cancelado:'Cancelado'};
var TONE={anunciado:'neutral',venta:'ok',ultimas:'warn',agotado:'bad',gratis:'ok',puerta:'neutral',reprogramado:'warn',cancelado:'bad'};
var VERIFY={productora:{short:'Confirmado por la productora',on:true},verificado:{short:'Verificado',on:true},anunciado:{short:'Anunciado, sin verificar',on:false}};
var ROLES={headliner:'Headliner',soporte:'Soporte',invitado:'Invitado'};
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MONTHS_S=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DAYS_S=['dom','lun','mar','mié','jue','vie','sáb'];
var SITE_DEFAULTS={name:'Distorsión',tagline:'La agenda de shows de metal en Argentina. Cada fecha verificada, cada cambio a la vista.',about:'',instagram:'',email:'',whatsapp:'',waChannel:'',telegram:'',submitNote:'¿Tocás o producís un show? Mandanos los datos y lo sumamos a la agenda.',publicUrl:''};

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function enc(s){return encodeURIComponent(s||'')}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)}
function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{var x=new URL(u);return (x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch(e){return ''}}
function digits(s){return String(s||'').replace(/\D/g,'')}
function readJSON(id){try{var el=document.getElementById(id);return el?JSON.parse(el.textContent):null}catch(e){return null}}
function jsonScript(id,obj){return '<script type="application/json" id="'+id+'">'+JSON.stringify(obj).replace(/</g,'\\u003c')+'<\/script>'}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function clone(o){return JSON.parse(JSON.stringify(o))}

function parseD(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null}
function todayStr(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}}
function addDays(s,n){var d=parseD(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function daysUntil(s){var d=parseD(s);return d?Math.round((d-parseD(todayStr()))/864e5):-1}
function longDate(s){var d=parseD(s);if(!d)return 'Fecha a confirmar';return cap(DAYS[d.getUTCDay()])+' '+d.getUTCDate()+' de '+MONTHS[d.getUTCMonth()]+' de '+d.getUTCFullYear()}
function shortDate(s){var d=parseD(s);if(!d)return 'sin fecha';return DAYS_S[d.getUTCDay()]+' '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+String(d.getUTCFullYear()).slice(2)}
function numDate(s){var d=parseD(s);if(!d)return '';return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear()}
function whenText(s){var n=daysUntil(s);if(n<0)return 'Ya pasó';if(n===0)return 'Es hoy';if(n===1)return 'Es mañana';return 'Faltan '+n+' días'}
function weekendRange(){var t=todayStr(),wd=parseD(t).getUTCDay();if(wd===0)return [t,t];if(wd>=5)return [t,addDays(t,7-wd)];return [addDays(t,5-wd),addDays(t,7-wd)]}
function cmp(a,b){return ((a.date||'')+(a.start||a.doors||'')).localeCompare((b.date||'')+(b.start||b.doors||''))}

/* ---------- data ---------- */
var BLANK={visibility:'published',featured:false,ticketStatus:'venta',verify:'anunciado',checked:'',internal:'',sources:[],changes:[],title:'',lineup:[],genres:[],date:'',doors:'',start:'',venue:'',address:'',city:'',province:'',price:'',age:'',tickets:[],links:[],description:'',flyer:null,gallery:[]};
function normalizeShow(s){
  var o=Object.assign(clone(BLANK),s||{});
  if(!o.id)o.id=uid();
  ['lineup','genres','tickets','links','gallery','sources','changes'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[]});
  o.lineup=o.lineup.map(function(b){return Object.assign({name:'',role:'soporte',from:'',setlist:''},b||{})});
  if(!VERIFY[o.verify])o.verify='anunciado';
  return o;
}
function newShow(){var s=normalizeShow({});s.province='CABA';s.lineup=[{name:'',role:'headliner',from:'',setlist:''}];s.tickets=[{label:'Comprar entradas',url:''}];s.checked=todayStr();s.createdAt=Date.now();return s}
var RAW=null,BASE_IMGS={};
function loadData(){
  var d=RAW?clone(RAW):{};
  DATA={site:Object.assign({},SITE_DEFAULTS,d.site||{}),shows:(Array.isArray(d.shows)?d.shows:[]).map(normalizeShow),bands:d.bands&&typeof d.bands==='object'?d.bands:{},venues:d.venues&&typeof d.venues==='object'?d.venues:{}};
  IMAGES={};
}
var SRC={style:document.getElementById('app-style').textContent,js:document.getElementById('app-js').textContent};
var DATA,IMAGES;loadData();

var art=null,dl={save:function(o){return new Promise(function(res){var b=new Blob([o.data],{type:/\.ics$/.test(o.filename)?'text/calendar':'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);res({status:'saved'})})}},canEdit=false,asVisitor=false,dirty=0,WORK=null,drawerMode=null,listAsk=null,discardAsk=false,pendingImport=null,LB={ids:[],i:0},SUB={},IXQ='';
var F={q:'',prov:'',genre:'',range:'all',past:false};
try{var saved=JSON.parse(localStorage.getItem('agenda-filtros')||'null');if(saved){F.prov=saved.prov||'';F.range=saved.range||'all'}}catch(e){}
function savePrefs(){try{localStorage.setItem('agenda-filtros',JSON.stringify({prov:F.prov,range:F.range}))}catch(e){}}

function editorView(){return canEdit&&!asVisitor}
function isPub(s){return s.visibility!=='draft'}
function pool(){return DATA.shows.filter(function(s){return editorView()||isPub(s)})}
function img(id){return id?(IMAGES[id]||'img/'+id):''}
function bands(s){return (s.lineup||[]).filter(function(b){return b&&String(b.name||'').trim()})}
function headline(s){
  var lu=bands(s);
  if(s.title&&s.title.trim())return {big:s.title.trim(),sub:lu.map(function(b){return b.name}).join(' · ')};
  var heads=lu.filter(function(b){return b.role==='headliner'});
  var h=heads.length?heads:lu.slice(0,1);
  var rest=lu.filter(function(b){return h.indexOf(b)<0});
  return {big:h.map(function(b){return b.name}).join(' + ')||'Show sin nombre',sub:rest.length?'+ '+rest.map(function(b){return b.name}).join(' · '):''};
}
function place(s){return [s.venue,[s.city,s.province].filter(Boolean).join(', ')].filter(Boolean).join(' · ')}
function mapsUrl(o){var q=[o.venue||o.name,o.address,o.city,o.province,'Argentina'].filter(Boolean).join(', ');return 'https://www.google.com/maps/search/?api=1&query='+enc(q)}
function firstTicket(s){return (s.tickets||[]).map(function(x){return safeUrl(x.url)}).filter(Boolean)[0]||''}
function startParts(s){var t=(s.start||s.doors||'20:00').split(':'),p=(s.date||'').split('-');return {y:+p[0],m:+p[1],d:+p[2],h:+t[0]||20,mi:+t[1]||0}}
function calUrl(s){
  var p=startParts(s),st=new Date(Date.UTC(p.y,p.m-1,p.d,p.h,p.mi)),en=new Date(st.getTime()+4*36e5);
  var f=function(d){return d.toISOString().replace(/[-:]/g,'').slice(0,15)};var hl=headline(s);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+enc(hl.big+(hl.sub?' '+hl.sub:''))+'&dates='+f(st)+'/'+f(en)+'&ctz=America/Argentina/Buenos_Aires&location='+enc([s.venue,s.address,s.city].filter(Boolean).join(', '))+'&details='+enc([s.price,firstTicket(s)].filter(Boolean).join('\n'));
}
function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFor(list){
  var f=function(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')};
  var out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//'+icsEsc(DATA.site.name)+'//Agenda//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:'+icsEsc(DATA.site.name)];
  list.forEach(function(s){
    if(!parseD(s.date))return;var p=startParts(s);
    var st=new Date(Date.UTC(p.y,p.m-1,p.d,p.h+3,p.mi)),en=new Date(st.getTime()+4*36e5),hl=headline(s);
    out.push('BEGIN:VEVENT','UID:'+s.id+'@agenda-metal','DTSTAMP:'+f(new Date()),'DTSTART:'+f(st),'DTEND:'+f(en),
      'SUMMARY:'+icsEsc(hl.big+(hl.sub?' '+hl.sub:'')+(s.ticketStatus==='cancelado'?' (CANCELADO)':'')),
      'LOCATION:'+icsEsc([s.venue,s.address,s.city,s.province].filter(Boolean).join(', ')),
      'DESCRIPTION:'+icsEsc([s.price,firstTicket(s)?'Entradas: '+firstTicket(s):'',showLink(s)].filter(Boolean).join('\n')));
    if(s.ticketStatus==='cancelado')out.push('STATUS:CANCELLED');
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');return out.join('\r\n');
}
function showLink(s){var u=String(DATA.site.publicUrl||'').trim()||(location.origin+location.pathname);return u.split('#')[0]+'#s-'+s.id}
function shareText(s){
  var hl=headline(s);var lines=[hl.big+(hl.sub?' '+hl.sub:''),longDate(s.date)+((s.start||s.doors)?' · '+(s.start||s.doors)+' h':''),place(s)];
  if(s.price)lines.push(s.price);
  var tk=firstTicket(s);if(tk)lines.push('Entradas: '+tk);
  var l=showLink(s);if(l)lines.push(l);
  return lines.filter(Boolean).join('\n');
}
function richText(t){return esc(t).split(/\n{2,}/).map(function(p){return '<p>'+p.replace(/\n/g,'<br>').replace(/(https?:\/\/[^\s<]+)/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'})+'</p>'}).join('')}
function st(s){var k=s.ticketStatus;return STATUS[k]?'<span class="st st-'+(TONE[k]||'neutral')+'">'+esc(STATUS[k])+'</span>':''}
function ver(s){var v=VERIFY[s.verify]||VERIFY.anunciado;return '<span class="ver'+(v.on?' v-on':'')+'">'+(v.on?'■ ':'□ ')+esc(v.short)+'</span>'}
function editorBadges(s){if(!editorView())return '';var b='';if(s.visibility==='draft')b+='<span class="badge draft">Borrador</span>';if(s.featured)b+='<span class="badge feat">Destacado</span>';return b}
function posterHTML(name,line1,line2){return '<div class="poster">'+esc(name)+'<small>'+esc(line1||'')+(line2?'<br>'+esc(line2):'')+'</small></div>'}
function waLink(text){var n=digits(DATA.site.whatsapp);return n?'https://wa.me/'+n+'?text='+enc(text):''}

/* bands and venues derived from shows */
function bandIndex(){
  var m={};pool().forEach(function(s){bands(s).forEach(function(b){var k=slug(b.name);if(!k)return;var e=m[k]||(m[k]={slug:k,name:b.name,from:'',shows:[]});if(b.from&&!e.from)e.from=b.from;e.shows.push(s)})});
  Object.keys(DATA.bands).forEach(function(k){var r=DATA.bands[k];if(!m[k]&&(editorView()||r.bio||(r.links||[]).length))m[k]={slug:k,name:r.name||k,from:'',shows:[]}});
  Object.keys(m).forEach(function(k){var r=DATA.bands[k];if(r){if(r.name)m[k].name=r.name;if(r.from)m[k].from=r.from}});
  return m;
}
function venueIndex(){
  var m={};pool().slice().sort(cmp).forEach(function(s){var k=slug(s.venue);if(!k)return;var e=m[k]||(m[k]={slug:k,name:s.venue,address:'',city:'',province:'',shows:[]});['address','city','province'].forEach(function(f){if(s[f])e[f]=s[f]});e.shows.push(s)});
  Object.keys(m).forEach(function(k){var r=DATA.venues[k];if(r){['name','address','city','province'].forEach(function(f){if(r[f])m[k][f]=r[f]})}});
  return m;
}
function nextUp(list){var t=todayStr();return list.filter(function(s){return s.date>=t}).sort(cmp)}
function pastOf(list){var t=todayStr();return list.filter(function(s){return !(s.date>=t)}).sort(function(a,b){return cmp(b,a)})}

/* ---------- containers ---------- */
var app=document.getElementById('app');
['page','drawer','lightbox','toast','busy'].forEach(function(id){if(!document.getElementById(id)){var d=document.createElement('div');d.id=id;d.hidden=true;document.body.appendChild(d)}});
function syncLock(){document.body.classList.toggle('lock',!$('#page').hidden||!$('#drawer').hidden||!$('#lightbox').hidden)}

/* ---------- nav ---------- */
function navHTML(cur){
  var items=[['','Agenda'],['bandas','Bandas'],['lugares','Lugares'],['avisos','Avisos']];
  return '<nav class="nav" aria-label="Secciones">'+items.map(function(it,i){return (i?'<span class="sep" aria-hidden="true">/</span>':'')+'<a href="#'+it[0]+'"'+(cur===it[0]?' aria-current="page"':'')+'>'+it[1]+'</a>'}).join('')+'<a class="cta" href="#sumar">Sumá tu show</a></nav>';

function drawLB(){var el=$('#lightbox'),n=LB.ids.length;el.innerHTML='<div class="lightbox" data-act="lb-close"><img src="'+img(LB.ids[LB.i])+'" alt="" data-act="noop">'+
  '<button class="lb-btn lb-x" data-act="lb-close" aria-label="Cerrar">✕</button>'+(n>1?'<button class="lb-btn lb-prev" data-act="lb-prev" aria-label="Anterior">‹</button><button class="lb-btn lb-next" data-act="lb-next" aria-label="Siguiente">›</button><span class="lb-count mono">'+(LB.i+1)+' / '+n+'</span>':'')+'</div>';el.hidden=false;syncLock()}

/* ---------- toast / copy / ics ---------- */
var toastT;
function toast(msg,tone,ms){var el=$('#toast');el.innerHTML='<div class="toast'+(tone?' '+tone:'')+'" role="status">'+esc(msg)+'</div>';el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},ms||3400)}
function copyText(txt){
  var done=function(){toast('Copiado')};
  var fallback=function(){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok)done();else toast('No se pudo copiar automáticamente. Seleccioná el texto y copialo a mano.','bad',5000)};
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
}
async function saveIcs(list,name){
  if(!dl){toast('Esta vista no permite descargar archivos. Usá el botón de Google Calendar.','bad',5000);return}
  if(!list.length){toast('No hay fechas próximas para descargar.');return}
  try{await dl.save({filename:name,data:icsFor(list)})}catch(e){if(e&&e.code==='declined')return;toast('No se pudo descargar el archivo ('+(e&&e.code||'error')+'). Probá con Google Calendar.','bad',5000)}
}

function setPath(o,p,v){
  if(p==='genresText'){o.genres=v.split(',').map(function(x){return x.trim()}).filter(Boolean);return}
  var k=p.split('.'),cur=o;
  for(var i=0;i<k.length-1;i++){cur=cur[/^\d+$/.test(k[i])?+k[i]:k[i]];if(cur==null)return}
  cur[k[k.length-1]]=v;
}
function openEditor(id,dup,from){
  var src=id?DATA.shows.filter(function(s){return s.id===id})[0]:null;
  WORK=src?normalizeShow(clone(src)):newShow();
  if(dup){WORK.id=uid();WORK.date='';WORK.visibility='draft';WORK.changes=[];WORK.gallery=[];WORK.lineup.forEach(function(b){b.setlist=''});WORK.createdAt=Date.now()}
  WORK._isNew=!src||!!dup;WORK._from=from||null;WORK._orig=src&&!dup?clone(src):null;
  if(!WORK.lineup.length)WORK.lineup.push({name:'',role:'headliner',from:'',setlist:''});
  openDrawer('edit');
}
function diffShow(a,b){
  var out=[];if(!a||a.visibility==='draft')return out;
  if(a.date!==b.date)out.push('Cambió la fecha: '+numDate(a.date)+' → '+numDate(b.date));
  var ta=(a.doors||'')+'|'+(a.start||''),tb=(b.doors||'')+'|'+(b.start||'');
  if(ta!==tb)out.push('Cambió el horario: '+(a.start||a.doors||'sin hora')+' → '+(b.start||b.doors||'sin hora'));
  if(slug(a.venue)!==slug(b.venue))out.push('Cambió el lugar: '+(a.venue||'sin lugar')+' → '+(b.venue||'sin lugar'));
  if(a.ticketStatus!==b.ticketStatus)out.push('Estado: '+(STATUS[a.ticketStatus]||'')+' → '+(STATUS[b.ticketStatus]||''));
  var na=bands(a).map(function(x){return x.name}),nb=bands(b).map(function(x){return x.name}),sa=na.map(slug),sb=nb.map(slug);
  nb.forEach(function(n,i){if(sa.indexOf(sb[i])<0)out.push('Se sumó '+n)});
  na.forEach(function(n,i){if(sb.indexOf(sa[i])<0)out.push('Se bajó '+n)});
  if((a.price||'')!==(b.price||'')&&b.price)out.push('Cambió el precio: '+b.price);
  return out;
}
function saveShow(){
  var w=WORK,err=[];
  if(!w.date)err.push('Falta la fecha del show.');
  if(!String(w.title||'').trim()&&!bands(w).length)err.push('Agregá al menos una banda o el nombre del evento.');
  var bad=w.tickets.concat(w.links,w.sources).filter(function(t){return String(t.url||'').trim()&&!safeUrl(t.url)});
  if(bad.length)err.push('Hay un link que no es una dirección web válida. Revisá que empiece con https://');
  if(err.length){w._err=err;rerenderDrawer();var p=$('.dr-panel');if(p)p.scrollTop=0;return}
  var s=normalizeShow(w);
  s.title=String(s.title||'').trim();
  s.lineup=bands(s).map(function(b){return {name:String(b.name).trim(),role:b.role||'soporte',from:String(b.from||'').trim(),setlist:String(b.setlist||'').trim()}});
  var clean=function(arr,def){return arr.filter(function(t){return safeUrl(t.url)}).map(function(t){return {label:String(t.label||'').trim()||def,url:safeUrl(t.url)}})};
  s.tickets=clean(s.tickets,'Comprar entradas');s.links=clean(s.links,'Link');s.sources=clean(s.sources,'Fuente');
  var vk=slug(s.venue),known=vk&&venueIndex()[vk];
  if(known){['address','city','province'].forEach(function(f){if(!s[f]&&known[f])s[f]=known[f]})}
  var t=todayStr();
  diffShow(w._orig,s).forEach(function(x){s.changes.push({date:t,text:x})});
  if(String(w._note||'').trim())s.changes.push({date:t,text:String(w._note).trim()});
  ['_err','_ask','_isNew','_from','_orig','_note'].forEach(function(k){delete s[k]});
  s.updatedAt=Date.now();
  var from=w._from,i=DATA.shows.findIndex(function(x){return x.id===s.id});
  if(i>=0)DATA.shows[i]=s;else DATA.shows.push(s);
  markDirty();WORK=null;
  if(from==='list')openDrawer('list');else{$('#drawer').hidden=true;$('#drawer').innerHTML='';drawerMode=null;syncLock()}
  refreshAll();
  toast(s.visibility==='draft'?'Borrador guardado.':'Show guardado. Tocá Publicar cambios para que lo vea todo el mundo.',null,4500);
}

function compress(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      try{var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
        var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        var out=c.toDataURL('image/webp',q);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/jpeg',q);
        URL.revokeObjectURL(url);res(out)}catch(e){URL.revokeObjectURL(url);rej(e)}};
    im.onerror=function(e){URL.revokeObjectURL(url);rej(e)};
    im.src=url;
  });
}
function handleFiles(kind,list){
  if(!WORK)return;
  var files=Array.prototype.slice.call(list||[]).filter(function(f){return f&&f.type&&f.type.indexOf('image/')===0});
  if(!files.length){toast('Elegí una imagen (JPG, PNG o WebP).','bad');return}
  if(kind!=='gallery')files=files.slice(0,1);
  toast(files.length>1?'Procesando '+files.length+' imágenes…':'Procesando imagen…',null,60000);
  var target=WORK;
  (async function(){
    try{
      for(var i=0;i<files.length;i++){
        var uri=await compress(files[i],kind==='flyer'?1600:1400,kind==='flyer'?.82:.74);
        var id='i'+uid()+(uri.indexOf('data:image/webp')===0?'.webp':'.jpg');IMAGES[id]=uri;
        if(kind==='flyer')target.flyer=id;else if(kind==='photo')target.photo=id;else target.gallery.push(id);
      }
      if(WORK===target)rerenderDrawer();
      toast(files.length>1?'Fotos agregadas':'Imagen lista');
    }catch(e){toast('No pudimos leer esa imagen. Probá con otro archivo (JPG o PNG).','bad',5000)}
  })();
}

async function publish(){
  if(!canEdit||!GH.token){toast('Entrá al modo editor para publicar.','bad');return}
  pruneImages();
  var busy=$('#busy');busy.innerHTML='<div class="busy">Publicando</div>';busy.hidden=false;
  try{
    var ref=await gh('/git/ref/heads/'+enc(GH.branch)),head=ref.object.sha,commit=await gh('/git/commits/'+head),tree=[];
    var data={site:DATA.site,shows:DATA.shows,bands:DATA.bands,venues:DATA.venues};
    var jb=await gh('/git/blobs',{method:'POST',body:{content:JSON.stringify(data,null,1),encoding:'utf-8'}});
    tree.push({path:'data/agenda.json',mode:'100644',type:'blob',sha:jb.sha});
    var used=usedImages(data),ids=Object.keys(IMAGES).filter(function(id){return used[id]&&!BASE_IMGS[id]});
    for(var i=0;i<ids.length;i++){busy.innerHTML='<div class="busy">Subiendo imágenes '+(i+1)+'/'+ids.length+'</div>';var b=await gh('/git/blobs',{method:'POST',body:{content:IMAGES[ids[i]].split(',')[1],encoding:'base64'}});tree.push({path:'img/'+ids[i],mode:'100644',type:'blob',sha:b.sha})}
    Object.keys(BASE_IMGS).forEach(function(id){if(!used[id])tree.push({path:'img/'+id,mode:'100644',type:'blob',sha:null})});
    busy.innerHTML='<div class="busy">Publicando</div>';
    var nt=await gh('/git/trees',{method:'POST',body:{base_tree:commit.tree.sha,tree:tree}});
    var nc=await gh('/git/commits',{method:'POST',body:{message:'Agenda: '+dirty+(dirty===1?' cambio':' cambios')+' desde el editor',tree:nt.sha,parents:[head]}});
    await gh('/git/refs/heads/'+enc(GH.branch),{method:'PATCH',body:{sha:nc.sha}});
    RAW=clone(data);BASE_IMGS=used;dirty=0;discardAsk=false;
    busy.innerHTML='<div class="busy">Publicado</div>';setTimeout(function(){busy.hidden=true;busy.innerHTML=''},1200);
    updatePubBar();toast('Publicado. GitHub Pages tarda alrededor de un minuto en mostrar los cambios.',null,6000);
  }catch(e){
    busy.hidden=true;busy.innerHTML='';
    if(e.status===401)toast('El token no es válido o venció. Volvé a entrar desde /#editor.','bad',7000);
    else if(e.status===403||e.status===404)toast('El token no tiene permiso de escritura en '+GH.owner+'/'+GH.repo+'.','bad',7000);
    else if(e.status===409||e.status===422)toast('El repositorio cambió mientras editabas. Recargá la página y volvé a publicar.','bad',7000);
    else toast('No se pudo publicar ('+e.message+'). Tus cambios siguen acá: probá de nuevo.','bad',7000);
  }
}

    var s=Object.assign({},WORK);s.name=String(s.name||'').trim()||SITE_DEFAULTS.name;s.tagline=String(s.tagline||'').trim();
    var urls=['instagram','waChannel','telegram'];
    for(var i=0;i<urls.length;i++){var k=urls[i];if(String(s[k]||'').trim()){var u=safeUrl(s[k]);if(!u){toast('El link de '+({instagram:'Instagram',waChannel:'WhatsApp',telegram:'Telegram'})[k]+' no es válido.','bad');return}s[k]=u}}
    s.whatsapp=digits(s.whatsapp);
    DATA.site=s;markDirty();closeDrawer();render();toast('Ajustes guardados. Publicá para aplicarlos.')},
  'export':exportBackup,
  'pick-import':function(){var el=$('#imp-file');if(el)el.click()},
  'import-no':function(){pendingImport=null;rerenderDrawer()},
  'import-yes':function(){var j=pendingImport;var keep=IMAGES;DATA={site:Object.assign({},SITE_DEFAULTS,j.site||{}),shows:j.shows.map(normalizeShow),bands:j.bands||{},venues:j.venues||{}};IMAGES=Object.assign({},keep,j.images&&typeof j.images==='object'?j.images:{});pendingImport=null;markDirty();closeDrawer();render();toast('Backup importado. Revisalo y publicá.')},
  'publish':publish,
  'gh-login':ghLogin,
  'logout':ghLogout,
  'discard-ask':function(){discardAsk=true;updatePubBar()},
  'discard-no':function(){discardAsk=false;updatePubBar()},
  'discard-yes':function(){loadData();dirty=0;discardAsk=false;render();toast('Cambios descartados.')}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  var fn=A[t.dataset.act];if(!fn)return;
  e.preventDefault();e.stopPropagation();fn(t,e);
});
document.addEventListener('keydown',function(e){
  if(!$('#lightbox').hidden){if(e.key==='Escape')closeLB();else if(e.key==='ArrowRight')stepLB(1);else if(e.key==='ArrowLeft')stepLB(-1);return}
  var t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.classList&&t.classList.contains('drop')){e.preventDefault();A[t.dataset.kind==='photo'?'pick-photo':'pick-flyer']()}
  if(e.key==='Escape'){if(!$('#drawer').hidden){if(drawerMode==='list')closeDrawer();return}if(!$('#page').hidden)location.hash=''}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='f-q'){F.q=t.value;renderAgenda();return}
  if(t.id==='ix-q'){IXQ=t.value;var l=$('#ix-list');if(l)l.innerHTML=indexRows(t.dataset.kind);return}
  if(t.dataset&&t.dataset.sub){SUB[t.dataset.sub]=t.value;var m=$('#sub-msg');if(m)m.textContent=subMessage();var a=$('#sub-wa');if(a)a.href=waLink(subMessage());return}
  if(t.dataset&&t.dataset.path&&WORK){setPath(WORK,t.dataset.path,t.type==='checkbox'?t.checked:t.value)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-prov'){F.prov=t.value;savePrefs();renderAgenda();return}
  if(t.id==='f-past'){F.past=t.checked;renderMain();return}
  if(t.id==='imp-file'){handleImport(t.files&&t.files[0]);t.value='';return}
  if(t.dataset&&t.dataset.file){handleFiles(t.dataset.file,t.files);t.value='';return}
  if(t.dataset&&t.dataset.sub){SUB[t.dataset.sub]=t.value;var m=$('#sub-msg');if(m)m.textContent=subMessage();var a=$('#sub-wa');if(a)a.href=waLink(subMessage());return}
  if(t.dataset&&t.dataset.path&&WORK)setPath(WORK,t.dataset.path,t.type==='checkbox'?t.checked:t.value);
});
document.addEventListener('dragover',function(e){if($('#drawer').hidden)return;e.preventDefault();var d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.add('over')});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(e){if($('#drawer').hidden)return;e.preventDefault();var d=e.target.closest&&e.target.closest('.drop');var files=e.dataTransfer&&e.dataTransfer.files;if(!files||!files.length)return;if(d){d.classList.remove('over');handleFiles(d.dataset.kind,files)}else if(WORK&&WORK.gallery)handleFiles('gallery',files)});
document.addEventListener('paste',function(e){
  if(!WORK||$('#drawer').hidden||drawerMode==='settings'||drawerMode==='list')return;
  var files=Array.prototype.slice.call((e.clipboardData&&e.clipboardData.files)||[]).filter(function(f){return f.type.indexOf('image/')===0});
  if(!files.length)return;e.preventDefault();
  handleFiles(drawerMode==='edit'?(WORK.flyer?'gallery':'flyer'):'photo',files);
});

/* ---------- boot ---------- */
(function grain(){try{var n=140,c=document.createElement('canvas');c.width=c.height=n;var x=c.getContext('2d'),d=x.createImageData(n,n);for(var i=0;i<d.data.length;i+=4){var v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);document.documentElement.style.setProperty('--grain','url('+c.toDataURL()+')')}catch(e){}})();
(async function boot(){
  try{var r=await fetch('data/agenda.json?v='+Date.now(),{cache:'no-store'});if(r.ok)RAW=await r.json()}catch(e){}
  loadData();BASE_IMGS=usedImages(DATA);
  if(GH.token&&GH.owner&&GH.repo){try{var rp=await gh('');canEdit=!!(rp.permissions&&rp.permissions.push)}catch(e){canEdit=false}}
  render();
})();
})();
</script>
